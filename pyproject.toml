[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gloom"
version = "0.1.0"
description = "GLOOM: Gene network Learning and Organization through Optimized Machine intelligence — a modular ML pipeline for LUAD candidate gene prioritization and co-expression network analysis"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Rahma Y. Abdelsalam", email = "rahmayasserm@gmail.com" },
    { name = "Rana H. Abu-Zeid", email = "ranahamed2111@gmail.com" },
    { name = "Malick Traore", email = "malicktra100@gmail.com" },
    { name = "Khadija Adam Rogo", email = "khadijarogo212@gmail.com" },
    { name = "Olaitan I. Awe", email = "laitanawe@gmail.com" },
]
maintainers = [
    { name = "Rahma Y. Abdelsalam", email = "rahmayasserm@gmail.com" },
]
keywords = [
    "bioinformatics",
    "machine-learning",
    "lung-adenocarcinoma",
    "LUAD",
    "gene-prioritization",
    "gene-expression",
    "co-expression-network",
    "differential-expression",
    "TCGA",
    "GTEx",
    "RNA-seq",
    "pathway-enrichment",
    "KEGG",
    "positive-unlabeled-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"

# ── Core runtime dependencies ──────────────────────────────────────────────
# Source: gloom Package Reference (§8 Dependency Summary) — "Core" libraries
dependencies = [
    "click>=8.1.0",            # CLI framework (gloom CLI entry point)
    "pandas>=1.5.0",           # all tabular I/O
    "numpy>=1.23.0",           # numerical operations
    "scipy>=1.9.0",            # Welch t-test, skewness, kurtosis
    "statsmodels>=0.14.0",     # Benjamini-Hochberg FDR correction
    "scikit-learn>=1.1.0",     # ML models, RobustScaler, PCA, metrics
    "joblib>=1.2.0",           # model serialization (.joblib)
    "networkx>=2.8.0",         # co-expression network + centrality measures
    "matplotlib>=3.6.0",       # static PNG figures
]

# ── Optional feature groups ────────────────────────────────────────────────
# Source: gloom Package Reference (§8) — "Optional" libraries gate specific steps
[project.optional-dependencies]

# Interactive HTML dashboards (Step 17)
interactive = [
    "plotly>=5.10.0",
]

# KEGG pathway enrichment via Enrichr REST API (Step 19)
kegg = [
    "gseapy>=0.10.8",
]

# Excel output for `--format excel` flag
excel = [
    "openpyxl>=3.0.0",
]

# SMOTE + random undersampling (Step 11 class-imbalance handling)
resampling = [
    "imbalanced-learn>=0.11.0",
]

# Convenience: every optional pipeline feature
full = [
    "plotly>=5.10.0",
    "gseapy>=0.10.8",
    "openpyxl>=3.0.0",
    "imbalanced-learn>=0.11.0",
]

# Developer tooling
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "conda-build>=3.0",   # conda package building
]

# Everything: full pipeline + dev tools
all = [
    "gloom[full,dev]",
]

# ── Console script entry point ─────────────────────────────────────────────
# Source: §1 Package Identity — "Entry point: gloom CLI — registered via console_scripts"
[project.scripts]
gloom = "gloom.cli:main"

[project.urls]
Homepage = "https://github.com/omicscodeathon/gloom"
Repository = "https://github.com/omicscodeathon/gloom"
"Bug Tracker" = "https://github.com/omicscodeathon/gloom/issues"
Documentation = "https://github.com/omicscodeathon/gloom#readme"
Changelog = "https://github.com/omicscodeathon/gloom/blob/main/CHANGELOG.md"

# ── Setuptools: src/ layout ────────────────────────────────────────────────
# Source: §2 Project Folder Structure — package lives under src/gloom/
[tool.setuptools.packages.find]
where = ["src"]
include = ["gloom*"]

[tool.setuptools.package-data]
gloom = ["py.typed"]

# ── Black ──────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]

# ── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["gloom"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

# ── MyPy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
